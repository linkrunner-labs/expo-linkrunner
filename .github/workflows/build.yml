name: Build

# Verifies the SDK actually compiles. Separate from the SDK version check so a
# version mistake and a build break are reported independently.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm install, not npm ci: package-lock.json is missing the platform
      # specific lightningcss-* optional deps, so npm ci fails on any machine.
      # Regenerating the lockfile is tracked separately.
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
